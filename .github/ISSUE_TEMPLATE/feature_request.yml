name: 功能建议
description: 提议一个有明确人工参与边界的改进
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述真实使用场景和当前限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明用户如何明确启动任务、如何观察状态以及失败时如何恢复。
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 安全和权限边界
      description: 说明为什么方案不会引入自动绕过、后台抢单、任意命令或密钥托管。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 任务保持人工、用户明确启动且可观察。
          required: true
        - label: 建议中不包含真实凭据、Cookie、账号数据或 CAPTCHA token。
          required: true
