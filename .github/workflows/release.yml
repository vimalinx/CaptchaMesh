name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  quality:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: python -m pip install --disable-pip-version-check build
      - name: Verify release metadata and signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python tools/verify_release_metadata.py "$GITHUB_REF_NAME"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - run: python -m build
      - run: python tools/verify_public_release.py dist
      - name: Verify release wheel installs the Agent Skill
        run: |
          python -m venv "$RUNNER_TEMP/package-smoke"
          "$RUNNER_TEMP/package-smoke/bin/pip" install dist/*.whl
          CODEX_HOME="$RUNNER_TEMP/codex" "$RUNNER_TEMP/package-smoke/bin/captchamesh" skill install
          CODEX_HOME="$RUNNER_TEMP/codex" "$RUNNER_TEMP/package-smoke/bin/captchamesh" skill status --json
          mkdir "$RUNNER_TEMP/consumer-project"
          printf '%s\n' 'from twocaptcha import TwoCaptcha' > "$RUNNER_TEMP/consumer-project/captcha.py"
          "$RUNNER_TEMP/package-smoke/bin/captchamesh" skill inspect "$RUNNER_TEMP/consumer-project" --mode agent-api --json > "$RUNNER_TEMP/consumer-project/report.json"
          "$RUNNER_TEMP/package-smoke/bin/python" -c 'import json,sys; assert json.load(open(sys.argv[1]))["ready_for_supported_adapter"]' "$RUNNER_TEMP/consumer-project/report.json"
          test -f "$RUNNER_TEMP/codex/skills/captchamesh-adapter/SKILL.md"
      - run: python tools/build_hub_bundle.py --output dist
      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/captchamesh-release.jks"
          chmod 0600 "$RUNNER_TEMP/captchamesh-release.jks"
      - working-directory: app-src
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/captchamesh-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Prepare release files
        run: |
          cp app-src/app/build/outputs/apk/release/app-release.apk "dist/captchamesh-${GITHUB_REF_NAME}.apk"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          path: .
          format: spdx-json
          output-file: dist/captchamesh-${{ github.ref_name }}.spdx.json
          syft-version: v1.51.1
          upload-artifact: false
          upload-release-assets: false
      - name: Verify SPDX SBOM public boundary
        run: python tools/verify_sbom.py "dist/captchamesh-${GITHUB_REF_NAME}.spdx.json"
      - name: Generate release checksums
        run: (cd dist && sha256sum *.whl *.tar.gz *.apk *.spdx.json) > dist/SHA256SUMS
      - name: Attest release build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
