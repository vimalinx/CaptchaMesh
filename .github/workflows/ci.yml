name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python -m unittest discover -s tests -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt bandit pip-audit
      - run: bandit -q -r . -x ./.venv,./tests,./app-src
      - run: pip-audit --vulnerability-service osv -r requirements.txt
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - working-directory: app-src
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: captchamesh-android-debug
          path: app-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build
      - run: python tools/verify_public_release.py dist
      - run: python tools/build_hub_bundle.py --output dist
      - run: bash -n deploy/hub/install.sh
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: captchamesh --help
      - name: Verify packaged Agent Skill installation
        run: |
          skill_test_root=$(mktemp -d)
          consumer_root=$(mktemp -d)
          printf '%s\n' 'from twocaptcha import TwoCaptcha' > "$consumer_root/captcha.py"
          CODEX_HOME="$skill_test_root/codex" captchamesh skill install
          CODEX_HOME="$skill_test_root/codex" captchamesh skill status --json
          captchamesh skill inspect "$consumer_root" --mode agent-api --json > "$consumer_root/report.json"
          python -c 'import json,sys; assert json.load(open(sys.argv[1]))["ready_for_supported_adapter"]' "$consumer_root/report.json"
          test -f "$skill_test_root/codex/skills/captchamesh-adapter/SKILL.md"
          test -f "$skill_test_root/codex/skills/captchamesh-adapter/references/protocol.md"
