[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "captchamesh"
version = "0.19.8"
description = "Personal, endpoint-encrypted CAPTCHA handoff between an Agent and Android"
readme = "README.md"
authors = [{name = "Vimalinx"}]
requires-python = ">=3.11"
license = "MIT"
keywords = ["captcha", "android", "human-in-the-loop", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "2captcha-python==2.1.0",
  "cryptography==50.0.1",
  "hypercorn==0.18.0",
  "qrcode==8.2",
  "quart==0.22.0",
  "requests==2.34.2",
]

[project.urls]
Homepage = "https://mesh.vimalinx.com"
Source = "https://github.com/vimalinx/CaptchaMesh"
Issues = "https://github.com/vimalinx/CaptchaMesh/issues"
Changelog = "https://github.com/vimalinx/CaptchaMesh/blob/main/CHANGELOG.md"

[project.scripts]
captchamesh = "captchamesh_cli:main"

[tool.setuptools]
py-modules = [
  "broker",
  "broker_asgi",
  "captchamesh_cli",
  "captchamesh_client",
  "challenge_protocol",
  "diagnostic_log",
  "demo_registration",
  "local_bridge",
  "node_agent",
  "pair_device",
  "relay_client",
  "relay_protocol",
  "skill_manager",
  "twocaptcha_compat",
]

[tool.setuptools.packages.find]
include = ["captchamesh"]

[tool.setuptools.data-files]
"share/captchamesh/skills/captchamesh-adapter" = [
  ".skill/captchamesh-adapter/SKILL.md",
]
"share/captchamesh/skills/captchamesh-adapter/agents" = [
  ".skill/captchamesh-adapter/agents/openai.yaml",
]
"share/captchamesh/skills/captchamesh-adapter/references" = [
  ".skill/captchamesh-adapter/references/adapter-workflow.md",
  ".skill/captchamesh-adapter/references/protocol.md",
]
"share/captchamesh/skills/captchamesh-adapter/scripts" = [
  ".skill/captchamesh-adapter/scripts/inspect_registration.py",
]
